<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Decision-PGA diagnostic loop</title>
  <desc id="desc">Probability observations flow through geometry metrics into a decision-state diagnostic and workflow action.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#236a7c"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="360" rx="0" fill="#f7f8fb"/>
  <g fill="#ffffff" stroke="#dbe1ea" stroke-width="2" filter="url(#softShadow)">
    <rect x="42" y="82" width="180" height="138" rx="12"/>
    <rect x="282" y="82" width="180" height="138" rx="12"/>
    <rect x="522" y="82" width="180" height="138" rx="12"/>
    <rect x="762" y="82" width="156" height="138" rx="12"/>
  </g>
  <g fill="none" stroke="#236a7c" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 222 151 L 272 151"/>
    <path d="M 462 151 L 512 151"/>
    <path d="M 702 151 L 752 151"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172033">
    <text x="132" y="114" text-anchor="middle" font-size="17" font-weight="700">Probability</text>
    <text x="132" y="137" text-anchor="middle" font-size="17" font-weight="700">observations</text>
    <text x="132" y="169" text-anchor="middle" font-size="13" fill="#5d687a">candidate actions,</text>
    <text x="132" y="188" text-anchor="middle" font-size="13" fill="#5d687a">labels, or values</text>

    <text x="372" y="114" text-anchor="middle" font-size="17" font-weight="700">Simplex</text>
    <text x="372" y="137" text-anchor="middle" font-size="17" font-weight="700">geometry</text>
    <text x="372" y="169" text-anchor="middle" font-size="13" fill="#5d687a">square-root map,</text>
    <text x="372" y="188" text-anchor="middle" font-size="13" fill="#5d687a">mean, log map</text>

    <text x="612" y="114" text-anchor="middle" font-size="17" font-weight="700">Dispersion</text>
    <text x="612" y="137" text-anchor="middle" font-size="17" font-weight="700">shape</text>
    <text x="612" y="169" text-anchor="middle" font-size="13" fill="#5d687a">tensor, PC1,</text>
    <text x="612" y="188" text-anchor="middle" font-size="13" fill="#5d687a">anisotropy, drift</text>

    <text x="840" y="114" text-anchor="middle" font-size="17" font-weight="700">Workflow</text>
    <text x="840" y="137" text-anchor="middle" font-size="17" font-weight="700">action</text>
    <text x="840" y="169" text-anchor="middle" font-size="13" fill="#5d687a">proceed, clarify,</text>
    <text x="840" y="188" text-anchor="middle" font-size="13" fill="#5d687a">retrieve, replan</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="293" y="263" width="374" height="48" rx="24" fill="#e8f1f3" stroke="#b7d1d8"/>
    <text x="480" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#174a59">Diagnostic state: stable, ambiguous, diffuse, sensitive, or drifting</text>
  </g>
  <path d="M 840 220 C 840 318 132 318 132 230" fill="none" stroke="#b7d1d8" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="480" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#5d687a">Workflow outcomes can create new observations for the next diagnostic pass.</text>
</svg>
